name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK（cmdline-tools + platform-tools）
        uses: android-actions/setup-android@v3

      - name: 接受 Android SDK 许可协议
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: 安装编译所需平台与构建工具
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 配置 Gradle 8.6（无 wrapper，显式指定版本）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.6"

      - name: 运行单元测试（纯 JVM，无需设备）
        run: gradle :app:testDebugUnitTest

      - name: 构建 debug APK
        run: gradle :app:assembleDebug

      - name: 上传 debug APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk